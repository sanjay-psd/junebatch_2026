name: Java Docker Kubernetes Deployment

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Build Application
      run: |
        mvn clean package

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: |
        docker build -t sanjaydockerdesk/java-web:${{ github.run_number }} .

    - name: Push Docker Image
      run: |
        docker push sanjaydockerdesk/java-web:${{ github.run_number }}

    - name: Update Manifest Image
      run: |
        sed -i 's|sanjaydockerdesk/java-web:latest|sanjaydockerdesk/java-web:${{ github.run_number }}|g' manifest.yaml

    - name: Setup Kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f manifest.yaml

    - name: Verify Deployment
      run: |
        kubectl rollout status deployment/java-web-deployment-sanjay -n sanjay